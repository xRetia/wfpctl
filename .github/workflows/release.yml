name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (overrides tag name)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Test & Vet
        shell: bash
        working-directory: tools/wfpctl
        run: |
          go test -count=1 ./...
          go vet ./...

  build-cli:
    name: CLI ${{ matrix.goarch }}
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            out: wfpctl64.exe
          - goarch: 386
            out: wfpctl32.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Build
        shell: bash
        working-directory: tools/wfpctl
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "1.0.0")
          go build -trimpath -ldflags "-s -w -X main.versionStr=$VERSION" -o "${{ matrix.out }}" .

      - name: Verify layout (${{ matrix.goarch }})
        shell: bash
        working-directory: tools/wfpctl
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go test -count=1 -run TestFWPMFilter0LayoutMatchesNative ./...

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload"
          cp "tools/wfpctl/${{ matrix.out }}" "$GITHUB_WORKSPACE/upload/"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goarch }}
          path: upload/
          if-no-files-found: error

  build-gui:
    name: GUI ${{ matrix.arch }}
    needs: build-cli
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            python-arch: x64
            cli-artifact: cli-amd64
            cli-exe: wfpctl64.exe
            gui-zip: wfpctl-gui-x64.zip
          - arch: x86
            python-arch: x86
            cli-artifact: cli-386
            cli-exe: wfpctl32.exe
            gui-zip: wfpctl-gui-x32.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cli-artifact }}
          path: cli-exe/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
          cache: pip

      - name: Install
        run: pip install PyQt6 pyinstaller

      - name: Smoke test
        shell: bash
        working-directory: tools/wfpctl
        run: python gui/smoke_test.py

      - name: PyInstaller
        shell: bash
        working-directory: tools/wfpctl
        run: |
          pyinstaller --onefile --windowed --noconfirm \
            --name wfpctl-gui \
            --paths gui \
            --clean \
            gui/wfpctl_gui/__main__.py

      - name: Bundle
        shell: bash
        run: |
          mkdir -p bundle
          cp cli-exe/${{ matrix.cli-exe }} bundle/wfpctl.exe
          cp tools/wfpctl/dist/wfpctl-gui.exe bundle/
          python -c "
          import zipfile, os, pathlib
          zf = pathlib.Path('${{ matrix.gui-zip }}')
          with zipfile.ZipFile(zf, 'w', zipfile.ZIP_DEFLATED) as z:
              for f in sorted(pathlib.Path('bundle').iterdir()):
                  z.write(f, f.name)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.arch }}
          path: ${{ matrix.gui-zip }}

  release:
    name: Publish release
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "ver=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "ver=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          for f in wfpctl*.exe wfpctl-gui-*.zip; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
