name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (overrides tag name, e.g. 1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, 386, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "ver=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "ver=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Working directory
        shell: bash
        run: |
          cd tools/wfpctl 2>/dev/null && echo "WFPCTL_DIR=tools/wfpctl" >> "$GITHUB_ENV" || echo "WFPCTL_DIR=." >> "$GITHUB_ENV"
          echo "project dir: ${WFPCTL_DIR}"

      - name: Test
        shell: bash
        working-directory: ${{ env.WFPCTL_DIR }}
        run: go test ./...

      - name: Vet
        shell: bash
        working-directory: ${{ env.WFPCTL_DIR }}
        run: go vet ./...

      - name: Build
        shell: bash
        working-directory: ${{ env.WFPCTL_DIR }}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.versionStr=${{ steps.ver.outputs.ver }}" -o "dist/wfpctl-windows-${{ matrix.goarch }}.exe" .

      - name: Checksums
        shell: bash
        working-directory: ${{ env.WFPCTL_DIR }}
        run: |
          cd dist
          for f in *.exe; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.WFPCTL_DIR }}/dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true