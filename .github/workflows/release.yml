name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (overrides tag name)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Test & Vet
        shell: pwsh
        run: |
          go test -count=1 ./...
          go vet ./...

  build-cli:
    name: CLI ${{ matrix.goarch }}
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            out: wfpctl64.exe
          - goarch: 386
            out: wfpctl32.exe
          - goarch: arm64
            out: wfpctl-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Build
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          $VERSION = if (Test-Path VERSION) { (Get-Content VERSION -Raw).Trim() } else { "1.0.0" }
          go build -trimpath -ldflags "-s -w -X main.versionStr=$VERSION" -o "${{ matrix.out }}" .

      - name: Verify layout (${{ matrix.goarch }})
        shell: pwsh
        env:
          GOARCH: ${{ matrix.goarch == 'arm64' && 'amd64' || matrix.goarch }}
        run: go test -count=1 -run TestFWPMFilter0LayoutMatchesNative ./...

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upload | Out-Null
          Copy-Item "${{ matrix.out }}" upload/

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goarch }}
          path: upload/
          if-no-files-found: error

  build-gui:
    name: GUI x64
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cli-amd64
          path: cli-exe/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install
        run: pip install PyQt6 pyinstaller

      - name: Smoke test
        run: python gui/smoke_test.py

      - name: PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --noconfirm `
            --name wfpctl-gui `
            --paths gui `
            --icon gui/wfpctl_gui/assets/wfpctl.ico `
            --add-data "gui/wfpctl_gui/assets/wfpctl.ico;wfpctl_gui/assets" `
            --clean `
            gui/wfpctl_gui/__main__.py

      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item "cli-exe/wfpctl64.exe" bundle/wfpctl.exe
          Copy-Item "dist/wfpctl-gui.exe" bundle/
          python -c "
          import zipfile, pathlib
          zf = pathlib.Path('wfpctl-gui-x64.zip')
          with zipfile.ZipFile(zf, 'w', zipfile.ZIP_DEFLATED) as z:
              for f in sorted(pathlib.Path('bundle').iterdir()):
                  z.write(f, f.name)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: gui-x64
          path: wfpctl-gui-x64.zip

  release:
    name: Publish release
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "ver=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "ver=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          for f in wfpctl*.exe wfpctl-gui-*.zip; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
